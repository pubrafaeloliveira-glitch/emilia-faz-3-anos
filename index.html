;color:#89190e;text-align:center}.player-musica button:focus-visible,.player-musica input:focus-visible{outline:3px solid #197140;outline-offset:3px}dialog{z-index:100}.player-musica .volume-label{font-size:12px;margin:0;font-weight:400}.player-musica .volume-area{display:flex;flex-direction:column;align-items:center;gap:3px}

</style></head><body><section class="entrada" id="entrada" aria-label="Entrar no convite"><button id="entrar" class="cartela">Clique e entre<br>nessa linda história</button></section><audio id="musica" src="assets/musica.mp3" loop preload="auto"></audio><main><section class="filme" id="abertura" aria-label="Vídeo de abertura"><video id="video" muted playsinline preload="auto" poster="assets/capa.jpg"><source src="assets/abertura.mp4" type="video/mp4"></video></section><section class="tela-loop" id="tela-loop" hidden aria-label="Convite animado"><video id="video02" muted loop playsinline preload="auto" poster="assets/convite-loop-atualizado.jpg"><source src="assets/convite-loop-atualizado.mp4" type="video/mp4"></video><p class="erro-video" id="erro-video" hidden>Confira os detalhes da festa abaixo.</p><div class="acao-loop"><button class="cta" id="abrir-info">Confirmar presença</button></div></section></main><dialog id="rsvp"><button class="fechar" aria-label="Fechar">×</button><h2>Vamos comemorar juntos?</h2><form id="form"><label for="nome">Seu nome</label><input id="nome" name="nome" required maxlength="100" autocomplete="name" placeholder="Como você se chama?"><label for="pessoas">Total de pessoas (incluindo você)</label><input id="pessoas" type="number" min="1" max="30" value="1" required><p id="orientacao">A mensagem será aberta no WhatsApp da família. Toque em enviar para confirmar sua presença.</p><button class="cta" type="submit">Enviar pelo WhatsApp</button></form></dialog><script>
const WHATSAPP_DESTINO = '5521980194595'; // País + DDD + número, apenas dígitos.
const intro=document.querySelector('#video'),loop=document.querySelector('#video02'),capa=document.querySelector('#abertura'),tela=document.querySelector('#tela-loop'),dialog=document.querySelector('#rsvp');
const musica=document.querySelector('#musica');
let iniciouLoop=false,saindo=false,entrou=false;
intro.muted=true;loop.muted=true;musica.volume=.65;musica.muted=false;musica.autoplay=false;
async function tentarMusica(){if(!entrou||!musica.paused)return;try{await musica.play();}catch{}}
// O primeiro toque permite o áudio nos navegadores que bloqueiam autoplay com som.
for(const evento of ['pointerdown','pointerup','touchend','click','keydown']){document.addEventListener(evento,e=>{tentarMusica();if(entrou&&!iniciouLoop&&intro.paused&&!intro.ended)intro.play().catch(()=>{});},{passive:true});}
for(const evento of ['loadeddata','canplay','canplaythrough'])musica.addEventListener(evento,tentarMusica);
window.addEventListener('load',tentarMusica);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tentarMusica();});
function revelarLoop(){if(!entrou||saindo)return;saindo=true;capa.classList.add('saindo');const fim=()=>{capa.hidden=true;intro.pause();};capa.addEventListener('transitionend',fim,{once:true});setTimeout(fim,850);}
async function iniciarLoop(){if(!entrou||iniciouLoop)return;iniciouLoop=true;tela.hidden=false;tela.inert=false;try{await loop.play();revelarLoop();}catch{revelarLoop();document.querySelector('#erro-video').hidden=false;}}
intro.addEventListener('ended',iniciarLoop);intro.addEventListener('error',iniciarLoop);intro.querySelector('source').addEventListener('error',iniciarLoop);
loop.addEventListener('error',()=>{document.querySelector('#erro-video').hidden=false;revelarLoop();});
loop.querySelector('source').addEventListener('error',()=>{document.querySelector('#erro-video').hidden=false;revelarLoop();});
document.querySelector('#abrir-info').addEventListener('click',()=>{tentarMusica();dialog.showModal();});
document.querySelector('.fechar').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
if(WHATSAPP_DESTINO)document.querySelector('#orientacao').textContent='A mensagem será aberta no WhatsApp da família. Toque em enviar para confirmar sua presença.';
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const nome=document.querySelector('#nome').value.trim();if(!nome){document.querySelector('#nome').focus();return;}const n=Number(document.querySelector('#pessoas').value);const msg=`mais uma confirmação de presença!
Nome: ${nome}
Número de pessoas: ${n}`;window.open('https://wa.me/'+WHATSAPP_DESTINO+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');});
document.querySelector('#entrar').addEventListener('click',()=>{
 if(entrou)return;
 entrou=true;
 // Dispara áudio e vídeo dentro do clique para autorizar a reprodução com som.
 tentarMusica();
 document.querySelector('#entrada').hidden=true;
 if(intro.error){iniciarLoop();return;}
 intro.play().catch(()=>{capa.addEventListener('click',()=>intro.play().catch(()=>{}),{once:true});});
});
</script><noscript><p style="position:fixed;inset:0;z-index:60;padding:32px;background:#fff0ce;color:#89190e">Ative o JavaScript para abrir o convite e confirmar sua presença.</p></noscript></body></html>
